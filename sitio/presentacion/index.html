/* ================= stage ================= */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;perspective:1700px;opacity:0;transition:opacity .9s .9s;background:linear-gradient(180deg,#0e1b27,var(--bg) 70%)}

.md{position:relative;min-height:0;display:flex;flex-direction:column;gap:12px;justify-content:center;perspective:1100px}
.fg{position:relative;min-height:0;flex:1 1 0;display:flex;flex-direction:column;opacity:0;transform:rotateY(-38deg) translateX(-24px);transform-origin:left center;transition:opacity .8s,transform 1s cubic-bezier(.2,.8,.2,1)}
.fg.on{opacity:1;transform:none}

.fg.ct img{object-fit:contain;background:#f4f7f8}
.fg.on img{animation:kb 16s ease-out both}
.fg.ct.on img{animation:none}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
.fg figcaption{flex:none;margin-top:6px;font-size:12.5px;line-height:1.35;color:var(--mut)}
.fg figcaption b{color:var(--ink);font-weight:700}
.fg figcaption .t{display:block;font-style:italic;color:#cfd8dc}
.fg figcaption i.n{font-style:italic}
.fg svg{width:100%;height:100%;display:block}
.fg.sv .im{background:#0f1f2d}

.stp{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .9s cubic-bezier(.2,.8,.2,1)}
.stp.on{opacity:1;transform:none}
.nv{display:grid;gap:10px;align-content:center;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.done .nv{opacity:1;transform:none}
.nv .chip{font-size:15px;padding:.75em 1.2em;text-align:center;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.nv .chip:hover{border-color:var(--gold);background:#17303f}

.eg{position:absolute;top:50%;z-index:4;width:54px;height:54px;margin-top:-27px;border-radius:50%;border:1px solid #ffffff55;background:rgba(18,36,51,.5);color:#fff;font-size:24px;line-height:1;opacity:.28;transition:opacity .3s,background .3s,transform .3s}
.eg:hover:not(:disabled){opacity:1;background:rgba(210,170,106,.9);color:var(--bg);transform:scale(1.08)}

#pv{left:clamp(6px,1.4vw,16px)}#nt{right:clamp(6px,1.4vw,16px)}
.eg.gl{animation:glow 1.6s ease-out 1}

@media (max-width:760px){

}
/* ================= bottom: scrollable section track + footer ================= */
.bar{position:relative;flex:none;display:flex;align-items:center;gap:10px;background:#08121b;border-top:1px solid var(--line);opacity:0;transition:opacity .8s 1.1s;padding:9px clamp(12px,3vw,30px) 11px}

.cr:hover{background:var(--gold);color:var(--bg)}
